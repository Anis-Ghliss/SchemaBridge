services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schemabridge
      POSTGRES_PASSWORD: schemabridge
      POSTGRES_DB: schemabridge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemabridge -d schemabridge"]
      interval: 5s
      timeout: 5s
      retries: 20

  schemabridge:
    image: ${SCHEMABRIDGE_IMAGE:-schemabridge:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://schemabridge:schemabridge@postgres:5432/schemabridge?schema=public
      PORT: 4000
      PROXY_PORT: 8080
      PROXY_REQUIRE_AUTH: ${PROXY_REQUIRE_AUTH:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "4000:4000"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
